[project]
name = "palisade"
version = "1.0.0"
description = "PALISADE: a privileged security-mediation sidecar for agentic scientific platforms."
readme = "README.md"
requires-python = "==3.14.3"
# license: set at release time -- see LICENSE (placeholder) and NOTICE
# license = { text = "..." }
authors = [
    { name = "Emily Herron", email = "herronej@ornl.gov" },
    { name = "Josh Hutchins" },
    { name = "Amir Sadovnik" },
    { name = "Jesse Hines" },
    { name = "Vanessa Lama" },
    { name = "Junqi Yin" },
    { name = "Feiyi Wang", email = "fwang2@ornl.gov" },
]
keywords = [
    "agentic-ai",
    "information-flow-control",
    "prompt-injection",
    "hpc",
    "slurm",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]

# Runtime only. PALISADE is installed as a dependency of a host application,
# so this list stays to what the sidecar itself imports -- the benchmark's
# dependencies (and its 205-instance corpus) live in the `siege` member and
# never reach a host's production environment.
#
# Pinned, not floated. These are the versions the reported numbers were
# produced against; `pydantic-ai>=1.90` in particular floats to a 2.x that
# removes `MCPServerStreamableHTTP`, which G2's descriptor pinning depends on.
dependencies = [
    "pydantic-ai==1.90.0",
    "pydantic-ai-shields==0.3.2",
    "pydantic-settings==2.14.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "anyio[trio]==4.13.0",
    "jsonschema==4.26.0",
    "numpy==2.4.4",
]

[project.optional-dependencies]
# G4 static-analysis tier (+semgrep in the ablation). The ruleset is bundled
# with the sidecar rather than pinned to an upstream registry, so this
# reproduces without network access.
palisade-g4 = ["semgrep==1.79.0"]

# G3 corpus-integrity pinning against a served ChromaDB store. Heavy; only
# the `pin_corpus` operator CLI and the live G3 check need it.
retrieval = ["chromadb==1.5.9", "sentence-transformers==5.5.0"]

# Provenance shipping to a Flowcept broker. Lazily imported: the sidecar
# degrades to JSONL when the broker is unreachable or the extra is absent.
flowcept = ["flowcept"]

# The quarantined slow tier talks to an OpenAI-compatible endpoint.
quarantine = ["openai==2.35.0"]

[project.scripts]
palisade-pin-corpus = "palisade.pin_corpus:main"

[project.urls]
Homepage = "https://github.com/ORNL/palisade-siege"
Repository = "https://github.com/ORNL/palisade-siege"
Documentation = "https://github.com/ORNL/palisade-siege/blob/main/docs/palisade/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palisade"]
artifacts = ["*.md", "*.yaml", "*.json", "*.lua"]

# --------------------------------------------------------------------------
# Workspace. One checkout, two distributions: a host application depends on
# `palisade` alone and never installs the attack corpus.
# --------------------------------------------------------------------------
[tool.uv.workspace]
members = ["siege"]

[tool.uv.sources]
siege = { workspace = true }

[dependency-groups]
# Reproducing the paper needs the benchmark; deploying the sidecar does not.
dev = [
    "siege",
    "siege[agentdojo,figures,retrieval]",
    "palisade[palisade-g4,quarantine,retrieval]",
    "pytest==9.0.3",
    "scipy==1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["src/palisade", "siege/src/siege", "tools"]
# `tools` is a repo-root package, not an installed one -- the paper cites
# the analysis modules as `tools.*` and they run from a checkout.
pythonpath = ["."]
# Reproduction runs are deterministic at seed 42; do not shuffle.
addopts = "-p no:randomly"
markers = [
    "host_integration: requires the VISTA reference deployment (auto-skipped)",
    "served_model: requires a served OpenAI-compatible endpoint",
    "slurm: requires the containerized slurmctld under docker/slurm",
]
