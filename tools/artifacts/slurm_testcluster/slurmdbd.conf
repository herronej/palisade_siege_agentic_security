# Minimal slurmdbd for the PALISADE test cluster (R13-10).
#
# This exists so the B5 sweep can be scored against a controller that can
# actually validate an account, an association and a QoS -- the configuration
# the reviewer correctly identified as absent from the original measurement,
# and without which `--qos=premium` cannot be rejected because there is no
# accounting database to reject it against.
#
# Local-only, no replication, no archive: the sweep submits and immediately
# cancels, so nothing accumulates.
AuthType=auth/munge
DbdHost=localhost
DbdPort=6819
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
# /run is root-owned; slurmdbd drops to SlurmUser before writing the pidfile.
PidFile=/run/slurm/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=localhost
StoragePort=3306
StorageUser=slurm
StoragePass=palisade
StorageLoc=slurm_acct_db
